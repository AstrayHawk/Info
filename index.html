
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astray Hawk · Apps and tools</title>
    <meta name="description" content="Android apps and web tools by Astray Hawk.">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        :root{
            --bg:#f5f6fa;--card:#fff;--border:#e4e6ee;--text:#14151f;--muted:#5d6277;
            --accent:#4f46e5;--accent-ink:#fff;
            --shadow:0 1px 2px rgba(20,21,31,.05),0 8px 24px -12px rgba(20,21,31,.12);
            --bar:rgba(245,246,250,.85);--chip:#eef0f7;
        }
        @media(prefers-color-scheme:dark){
            :root{
                --bg:#0d0e14;--card:#161722;--border:#262836;--text:#eceefa;--muted:#9a9fb8;
                --accent:#818cf8;--accent-ink:#0d0e14;--shadow:none;
                --bar:rgba(13,14,20,.85);--chip:#1e2030;
            }
        }

        html{scroll-behavior:smooth;scroll-padding-top:80px}
        body{
            background:var(--bg);color:var(--text);
            font-family:'Manrope',system-ui,sans-serif;
            line-height:1.55;-webkit-font-smoothing:antialiased;
        }
        a{color:inherit}
        a:focus-visible,button:focus-visible,input:focus-visible{
            outline:2px solid var(--accent);outline-offset:2px
        }
        .wrap{max-width:1120px;margin:0 auto;padding:0 24px}

        /* Hero */
        .hero{padding:72px 0 48px}
        .hero h1{
            font-size:clamp(34px,5.4vw,56px);font-weight:800;
            line-height:1.08;letter-spacing:-.03em;max-width:15ch
        }
        .hero p{margin-top:16px;font-size:17px;color:var(--muted);max-width:46ch}
        .hero-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
        .btn{
            display:inline-flex;align-items:center;gap:10px;padding:12px 20px;
            border-radius:12px;font-size:14px;font-weight:700;text-decoration:none;
            transition:transform .15s,box-shadow .15s,background .15s
        }
        .btn svg{width:18px;height:18px}
        .btn-primary{background:var(--accent);color:var(--accent-ink)}
        .btn-primary:hover{transform:translateY(-1px)}
        .btn-ghost{
            background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow)
        }
        .btn-ghost:hover{border-color:var(--accent)}

        /* Toolbar */
        .bar{
            position:sticky;top:0;z-index:5;background:var(--bar);
            backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
            border-bottom:1px solid var(--border)
        }
        .bar .wrap{
            display:flex;align-items:center;justify-content:space-between;
            gap:16px;padding-top:12px;padding-bottom:12px
        }
        .tabs{display:flex;gap:4px;background:var(--chip);padding:4px;border-radius:12px}
        .tab{
            border:0;background:none;font:700 13px 'Manrope',sans-serif;
            color:var(--muted);padding:8px 16px;border-radius:9px;
            cursor:pointer;display:flex;gap:8px;align-items:center
        }
        .tab .cnt{font-size:11px;opacity:.75}
        .tab.active{
            background:var(--card);color:var(--text);
            box-shadow:0 1px 3px rgba(0,0,0,.12)
        }
        .search{
            display:flex;align-items:center;gap:8px;background:var(--card);
            border:1px solid var(--border);border-radius:12px;padding:9px 14px;width:260px
        }
        .search:focus-within{border-color:var(--accent)}
        .search svg{width:15px;height:15px;color:var(--muted);flex-shrink:0}
        .search input{
            border:0;outline:0;background:none;font:500 14px 'Manrope',sans-serif;
            color:var(--text);width:100%
        }
        .search input::placeholder{color:var(--muted)}

        /* Grid */
        .grid{
            display:grid;grid-template-columns:repeat(3,1fr);
            gap:18px;padding:32px 0 80px
        }
        .card{
            background:var(--card);border:1px solid var(--border);
            border-radius:18px;padding:22px;display:flex;flex-direction:column;
            box-shadow:var(--shadow);transition:transform .2s,border-color .2s
        }
        .card:hover{transform:translateY(-3px);border-color:var(--accent)}
        .card-head{display:flex;align-items:center;gap:14px}
        .icon{
            position:relative;width:64px;height:64px;border-radius:16px;
            flex-shrink:0;overflow:hidden;display:flex;align-items:center;
            justify-content:center;color:#fff;font-weight:800;font-size:22px;
            letter-spacing:-.02em
        }
        .icon img{
            position:absolute;inset:0;width:100%;height:100%;
            object-fit:cover;background:var(--card)
        }
        .card h3{font-size:16px;font-weight:700;line-height:1.25}
        .beta{
            display:inline-block;margin-top:5px;font-size:11px;font-weight:700;
            color:#b45309;background:#fef3c7;padding:2px 9px;border-radius:100px
        }
        @media(prefers-color-scheme:dark){
            .beta{color:#fcd34d;background:rgba(251,191,36,.14)}
        }
        .card p{
            margin:16px 0 20px;font-size:14px;color:var(--muted);flex:1;
            display:-webkit-box;-webkit-line-clamp:3;
            -webkit-box-orient:vertical;overflow:hidden
        }
        .card-foot{
            display:flex;align-items:center;justify-content:space-between;
            gap:10px;border-top:1px solid var(--border);padding-top:16px
        }
        .src{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--muted)}
        .src svg{width:16px;height:16px}
        .get{
            font-size:13px;font-weight:700;text-decoration:none;color:var(--accent-ink);
            background:var(--accent);padding:8px 16px;border-radius:100px;
            transition:opacity .15s
        }
        .get:hover{opacity:.85}
        .empty{grid-column:1/-1;text-align:center;padding:72px 0;color:var(--muted)}
        footer{
            border-top:1px solid var(--border);text-align:center;
            padding:28px;color:var(--muted);font-size:13px
        }

        @media(max-width:820px){
            .grid{grid-template-columns:repeat(2,1fr)}
        }
        @media(max-width:560px){
            .hero{padding:44px 0 32px}
            .grid{grid-template-columns:1fr;gap:14px}
            .btn{flex:1;justify-content:center}
            .bar .wrap{flex-direction:column;align-items:stretch}
            .search{width:100%}
            .tabs .tab{flex:1;justify-content:center}
        }
        @media(prefers-reduced-motion:reduce){
            *{transition:none!important}
        }
    </style>
</head>

<body>

<div class="wrap">
    <header class="hero">
        <h1>Apps and tools, built with curiosity.</h1>
        <p>Android apps and web tools by Astray Hawk. Free to use and share.</p>

        <div class="hero-actions">
            <a class="btn btn-primary" id="hero-profile" target="_blank"
               rel="noopener noreferrer"
               href="https://play.google.com/store/apps/dev?id=7297521515170224649"></a>

            <a class="btn btn-ghost" id="hero-all" target="_blank"
               rel="noopener noreferrer"
               href="https://play.google.com/store/apps/developer?id=Astray+Hawk"></a>
        </div>
    </header>
</div>

<div class="bar">
    <div class="wrap">
        <div class="tabs" role="tablist">
            <button class="tab active" role="tab" aria-selected="true"
                    data-tab="apps" onclick="switchTab(this)">
                Apps <span class="cnt" id="tc-apps"></span>
            </button>

            <button class="tab" role="tab" aria-selected="false"
                    data-tab="web" onclick="switchTab(this)">
                Websites <span class="cnt" id="tc-web"></span>
            </button>
        </div>

        <label class="search">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round">
                <circle cx="7" cy="7" r="4.5"/>
                <path d="M10.5 10.5l3 3"/>
            </svg>
            <input id="q" type="search" placeholder="Search apps and tools"
                   aria-label="Search" oninput="filter()">
        </label>
    </div>
</div>

<div class="wrap">
    <main class="grid" id="grid"></main>
</div>

<footer>© Astray Hawk. All rights reserved.</footer>

<script>
    const ICON = {
        play: `<svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#00A0FF" d="M3.6 2.3c-.4.3-.6.8-.6 1.4v16.6c0 .6.2 1.1.6 1.4L13.3 12z"/>
            <path fill="#00E676" d="M13.3 12l3.3-3.3L5.2 2.1c-.5-.3-1.1-.3-1.6.2z"/>
            <path fill="#FF3A44" d="M13.3 12L3.6 21.7c.5.5 1.1.5 1.6.2l11.4-6.6z"/>
            <path fill="#FFD500" d="M16.6 8.7L13.3 12l3.3 3.3 3.8-2.2c1.1-.6 1.1-2.1 0-2.7z"/>
        </svg>`,

        gh: `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.1.79-.25.79-.56v-2c-3.2.7-3.87-1.37-3.87-1.37-.52-1.33-1.28-1.68-1.28-1.68-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.03 1.76 2.69 1.25 3.35.96.1-.74.4-1.25.73-1.54-2.55-.29-5.24-1.28-5.24-5.68 0-1.26.45-2.28 1.18-3.09-.12-.29-.51-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 015.77 0c2.2-1.49 3.17-1.18 3.17-1.18.62 1.59.23 2.76.11 3.05.74.81 1.18 1.83 1.18 3.09 0 4.41-2.69 5.38-5.25 5.67.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0023.5 12C23.5 5.65 18.35.5 12 .5z"/>
        </svg>`,

        web: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9.5"/>
            <path d="M2.5 12h19M12 2.5c2.6 2.8 3.9 6 3.9 9.5s-1.3 6.7-3.9 9.5c-2.6-2.8-3.9-6-3.9-9.5S9.4 5.3 12 2.5z"/>
        </svg>`
    };

    const ACTION = {play:'Get app',gh:'Download',web:'Visit'};
    const SRC = {play:'Google Play',gh:'GitHub APK',web:'Website'};

    const GRAD = {
        purple:'#7c3aed,#a78bfa',
        cyan:'#0891b2,#22d3ee',
        amber:'#d97706,#fbbf24',
        green:'#059669,#34d399',
        pink:'#db2777,#f472b6',
        slate:'#475569,#94a3b8'
    };

    const R = 'https://astrayhawk.github.io/Info/redirect.html?id=';

    const APPS = [
        {name:'Charging Monitor',desc:'Alerts when your phone hits a set charge level, with custom audio.',p:'amber',t:'play',link:R+'com.eagle.chargingmoniter'},
        {name:'Barcode Generator',desc:'Generate and scan barcodes instantly.',p:'purple',t:'play',link:R+'com.hawks.barcodegenerator'},
        {name:'Traffic Counter',desc:'Count, report, and survey traffic.',p:'green',t:'play',link:R+'com.hawks.trafficsurvey'},
        {name:'VX Player',desc:'Watch videos from storage and stream online.',p:'amber',t:'play',link:R+'com.hawks.vx_player'},
        {name:'Device Info',desc:'View device, battery, and network info in one place.',p:'pink',t:'play',link:R+'com.hawks.deviceinfo'},
        {name:'Server App',desc:'Launch and test HTML sites over Wi-Fi for learning.',p:'cyan',t:'play',link:R+'com.eagle.serverapplication'},
        {name:'Video Factory',desc:'Convert videos, download streams, and more.',p:'purple',t:'play',link:R+'com.hawks.videofactory'},
        {name:'Viber',desc:'Keep your device awake or use it as a vibration tool.',p:'green',t:'play',link:R+'com.hawks.m_vibe'},
        {name:'SF: Source Fetcher',desc:'Inspect HTML source and HTTP calls via WebView.',p:'amber',t:'play',link:R+'com.hawks.sourcefetcher'},
        {name:'GeoSnap',desc:'Capture photos with GPS location and timestamp.',p:'cyan',t:'play',link:R+'com.hawks.gps_camera'},
        {name:'Black Cat',desc:'Lock photos, videos and files in PIN-protected folders.',p:'purple',t:'play',link:R+'com.hawks.blackcat'},
        {name:'Bhagavad Gita',desc:'Read, listen and learn the Bhagavad Gita.',p:'amber',t:'play',link:R+'com.hawks.mythicalbooks'},
        {name:'Tic Tac Toe',desc:'Play with friends or challenge Jack, the smart AI.',p:'pink',t:'play',link:R+'com.hawks.tic_tac_toe'},
        {name:'TaskBee',desc:'Schedule tasks and get notified exactly on time.',p:'green',t:'play',link:R+'com.hawks.timebee'},
        {name:'Mock Location',desc:'Spoof GPS using coordinates or a Google Maps link.',p:'cyan',t:'play',link:R+'com.hawks.mock_location'},
        {name:'Numzy',desc:'Fun math puzzles for kids to learn numbers.',p:'purple',t:'play',link:R+'com.hawks.numzy'},
        {name:'ProtoPing',desc:'Monitor website uptime and get instant down alerts.',p:'cyan',t:'play',link:R+'com.hawks.protoping'},
        {name:'Zone Alert',desc:'Get reminders by location, with alerts when you arrive.',p:'green',t:'play',link:R+'com.hawks.zone_alert',beta:true},
        {name:'Shinobi Run',desc:'Dash as a ninja across water, earth and wood paths. Jump, slide and beat your best.',p:'cyan',t:'play',link:R+'com.hawks.shinobi_run',beta:true},
        {name:'Highway Horizon',desc:'Race bikes and cars through 100 highway rounds. Dodge traffic, hit nitro, win.',p:'purple',t:'play',link:R+'com.hawks.highwayhorizon',beta:true},
        {name:'Rank Zero',desc:'Rise from F-Rank to S-Rank. Slash through dungeons, slay bosses, awaken.',p:'pink',t:'play',link:R+'com.hawks.rankzero',beta:true},
        {name:'Online Compiler',desc:'Compile and run code from your mobile device.',p:'slate',t:'gh',link:'https://github.com/astrayhawk/Info/raw/main/Apks/Compiler.apk'},
        {name:'Browser',desc:'A simple, lightweight browser.',p:'green',t:'gh',link:'https://github.com/astrayhawk/Info/raw/main/Apks/Browser.apk'}
    ];

    const WEB = [
        {name:'Trinetra',desc:'A curated collection of useful websites.',p:'cyan',t:'web',link:'https://trinetra3.netlify.app/'},
        {name:'Eagle',desc:'Read my documentation.',p:'pink',t:'web',link:'https://trinetra3.netlify.app/home/eagle'},
        {name:'Text Encryption Tool',desc:'Encrypt and decrypt text with a modern tool.',p:'purple',t:'web',link:'https://trinetra3.netlify.app/Pages/Encrypt.html'},
        {name:'ProtoPing Docs',desc:'Documentation for the ProtoPing app.',p:'green',t:'web',link:'https://protoping.onrender.com/'}
    ];

    let activeTab = 'apps';

    const esc = s => s.replace(/[&<>"]/g, c => ({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;'
    }[c]));

    const initials = n => n.replace(/^\w+:\s*/, '')
        .split(/\s+/).slice(0,2).map(w => w[0]).join('').toUpperCase();

    function card(d) {
        const pid = d.t === 'play'
            ? new URL(d.link).searchParams.get('id')
            : '';

        // Automatically fetch Google Play app icon using package name
        const src = pid
            ? `https://avatarsapi.com/google-play/${pid}`
            : '';

        const img = src
            ? `<img src="${src}" alt="${esc(d.name)} icon"
                 loading="lazy" referrerpolicy="no-referrer"
                 onerror="this.remove()">`
            : '';

        const [c1,c2] = GRAD[d.p].split(',');

        return `<article class="card">
            <div class="card-head">
                <div class="icon" style="background:linear-gradient(135deg,${c1},${c2})">
                    ${esc(initials(d.name))}
                    ${img}
                </div>
                <div>
                    <h3>${esc(d.name)}</h3>
                    ${d.beta ? '<span class="beta">Beta</span>' : ''}
                </div>
            </div>

            <p>${esc(d.desc)}</p>

            <div class="card-foot">
                <span class="src">${ICON[d.t]}${SRC[d.t]}</span>
                <a class="get" href="${d.link}" target="_blank"
                   rel="noopener noreferrer"
                   aria-label="${ACTION[d.t]}: ${esc(d.name)}">
                    ${ACTION[d.t]}
                </a>
            </div>
        </article>`;
    }

    function render(data,q) {
        const list = q
            ? data.filter(d => (d.name+' '+d.desc).toLowerCase().includes(q))
            : data;

        document.getElementById('grid').innerHTML = list.length
            ? list.map(card).join('')
            : `<div class="empty">No results for “${esc(q)}”</div>`;
    }

    function switchTab(el) {
        activeTab = el.dataset.tab;

        document.querySelectorAll('.tab').forEach(b => {
            b.classList.remove('active');
            b.setAttribute('aria-selected', b === el);
        });

        el.classList.add('active');
        document.getElementById('q').value = '';

        render(activeTab === 'apps' ? APPS : WEB, '');
    }

    function filter() {
        render(
            activeTab === 'apps' ? APPS : WEB,
            document.getElementById('q').value.toLowerCase().trim()
        );
    }

    document.getElementById('hero-profile').innerHTML =
        ICON.play + 'Play Store page';

    document.getElementById('hero-all').innerHTML =
        ICON.play + 'All apps on Play Store';

    document.getElementById('tc-apps').textContent = APPS.length;
    document.getElementById('tc-web').textContent = WEB.length;

    render(APPS, '');
</script>

</body>
</html>
